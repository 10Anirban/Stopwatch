<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Timing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>APEX</h1>
        <nav>
            <span>Timer</span>
            <span>Laps</span>
            <span>Stats</span>
        </nav>
    </header>

    <main>
        <section class="timer-box">
            <div class="timer" id="timerDisplay">00:00:00</div>
            <div class="delta" id="deltaBadge">+0.00s</div>
            
            <div class="controls">
                <button class="stop-btn" id="startStopBtn">START</button>
                <button class="lap-btn" id="lapBtn" disabled>LAP</button>
                <button class="reset-btn" id="restartBtn">RESTART</button>
                <button class="reset-btn" id="refreshBtn">REFRESH</button>
            </div>

            <div class="telemetry">
                <div class="card">
                    <h4>AVERAGE LAP</h4>
                    <p id="avgLapTime">00:00.00</p>
                </div>
                <div class="card">
                    <h4>BEST LAP</h4>
                    <p id="bestLapTime">00:00.00</p>
                </div>
                <div class="card">
                    <h4>TOTAL LAPS</h4>
                    <p id="totalLaps">0</p>
                </div>
                <div class="card">
                    <h4>SESSION TIME</h4>
                    <p id="sessionTime">00:00:00</p>
                </div>
            </div>
        </section>

        <aside class="sidebar">
            <h3>LAP RECORDS</h3>
            <div id="lapsList">
                <!-- Laps will be added here dynamically -->
            </div>
            
            <div class="graph">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </aside>
    </main>

    <script>
        class Stopwatch {
            constructor() {
                this.startTime = 0;
                this.elapsedTime = 0;
                this.timerInterval = null;
                this.laps = [];
                this.isRunning = false;
                
                this.initElements();
                this.bindEvents();
            }

            initElements() {
                this.timerDisplay = document.getElementById('timerDisplay');
                this.startStopBtn = document.getElementById('startStopBtn');
                this.lapBtn = document.getElementById('lapBtn');
                this.restartBtn = document.getElementById('restartBtn');
                this.refreshBtn = document.getElementById('refreshBtn');
                this.deltaBadge = document.getElementById('deltaBadge');
                this.lapsList = document.getElementById('lapsList');
                this.avgLapTime = document.getElementById('avgLapTime');
                this.bestLapTime = document.getElementById('bestLapTime');
                this.totalLaps = document.getElementById('totalLaps');
                this.sessionTime = document.getElementById('sessionTime');
            }

            bindEvents() {
                this.startStopBtn.addEventListener('click', () => this.toggleTimer());
                this.lapBtn.addEventListener('click', () => this.recordLap());
                this.restartBtn.addEventListener('click', () => this.restart());
                this.refreshBtn.addEventListener('click', () => this.refresh());
            }

            toggleTimer() {
                if (this.isRunning) {
                    this.stop();
                } else {
                    this.start();
                }
            }

            start() {
                this.startTime = Date.now() - this.elapsedTime;
                this.timerInterval = setInterval(() => this.updateTimer(), 10);
                this.isRunning = true;
                this.startStopBtn.textContent = 'STOP';
                this.lapBtn.disabled = false;
            }

            stop() {
                clearInterval(this.timerInterval);
                this.isRunning = false;
                this.startStopBtn.textContent = 'START';
                this.lapBtn.disabled = true;
            }

            reset() {
                clearInterval(this.timerInterval);
                this.elapsedTime = 0;
                this.laps = [];
                this.isRunning = false;
                this.startStopBtn.textContent = 'START';
                this.lapBtn.disabled = true;
                this.updateDisplay();
                this.updateLapsList();
                this.updateStats();
            }

            restart() {
                // Clear everything
                clearInterval(this.timerInterval);
                this.elapsedTime = 0;
                this.laps = [];
                
                // Immediately start again
                this.startTime = Date.now();
                this.timerInterval = setInterval(() => this.updateTimer(), 10);
                this.isRunning = true;
                this.startStopBtn.textContent = 'STOP';
                this.lapBtn.disabled = false;
                
                this.updateDisplay();
                this.updateLapsList();
                this.updateStats();
            }

            refresh() {
                // Reload the page completely
                location.reload();
            }

            updateTimer() {
                this.elapsedTime = Date.now() - this.startTime;
                this.updateDisplay();
                this.updateStats();
            }

            updateDisplay() {
                const totalSeconds = Math.floor(this.elapsedTime / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                const milliseconds = Math.floor((this.elapsedTime % 1000) / 10);
                
                this.timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}:${String(milliseconds).padStart(2, '0')}`;
                this.sessionTime.textContent = this.timerDisplay.textContent;
            }

            recordLap() {
                if (!this.isRunning) return;
                
                const lapTime = this.elapsedTime;
                const lapNumber = this.laps.length + 1;
                
                this.laps.push({
                    number: lapNumber,
                    time: lapTime,
                    formattedTime: this.formatTime(lapTime)
                });
                
                this.updateLapsList();
                this.updateStats();
            }

            formatTime(time) {
                const totalSeconds = Math.floor(time / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                const milliseconds = Math.floor((time % 1000) / 10);
                
                return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}:${String(milliseconds).padStart(2, '0')}`;
            }

            updateLapsList() {
                this.lapsList.innerHTML = '';
                
                if (this.laps.length === 0) {
                    this.lapsList.innerHTML = '<div class="lap">No laps recorded</div>';
                    return;
                }
                
                const sortedLaps = [...this.laps].sort((a, b) => a.time - b.time);
                const bestLap = sortedLaps[0];
                
                this.laps.forEach(lap => {
                    const lapDiv = document.createElement('div');
                    lapDiv.className = 'lap';
                    if (lap.time === bestLap.time) {
                        lapDiv.classList.add('pb');
                    }
                    
                    lapDiv.innerHTML = `
                        <span>LAP ${lap.number}</span>
                        <span class="lap-time">${lap.formattedTime}</span>
                    `;
                    
                    this.lapsList.appendChild(lapDiv);
                });
            }

            updateStats() {
                this.totalLaps.textContent = this.laps.length;
                
                if (this.laps.length > 0) {
                    const lapTimes = this.laps.map(lap => lap.time);
                    const avgTime = lapTimes.reduce((a, b) => a + b, 0) / lapTimes.length;
                    const bestTime = Math.min(...lapTimes);
                    
                    this.avgLapTime.textContent = this.formatTime(avgTime);
                    this.bestLapTime.textContent = this.formatTime(bestTime);
                    
                    // Update delta badge
                    if (this.laps.length > 1) {
                        const lastLap = this.laps[this.laps.length - 1];
                        const avgTime = lapTimes.slice(0, -1).reduce((a, b) => a + b, 0) / (lapTimes.length - 1);
                        const delta = lastLap.time - avgTime;
                        const deltaText = delta >= 0 ? `+${this.formatTime(delta)}` : `-${this.formatTime(Math.abs(delta))}`;
                        this.deltaBadge.textContent = deltaText;
                    }
                } else {
                    this.avgLapTime.textContent = '00:00:00';
                    this.bestLapTime.textContent = '00:00:00';
                    this.deltaBadge.textContent = '+0.00s';
                }
            }
        }

        // Initialize stopwatch when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new Stopwatch();
        });
    </script>
</body>
</html>
